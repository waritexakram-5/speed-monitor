name: speed-monitor

on:
  schedule:
    - cron: '0 * * * *'   # every hour (GitHub may start it a few minutes late)
  workflow_dispatch:       # "Run workflow" button for a manual round

concurrency:
  group: speed-monitor
  cancel-in-progress: false

permissions:
  contents: write          # to save the backup copy of the results in the repository

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Install
        working-directory: runner
        run: npm ci

      - name: Measure all sites and upload to the report
        working-directory: runner
        env:
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: node run.js --once

      # Backup copy of every measurement, and rows that failed to upload are retried next hour.
      # These commits also keep the schedule active (GitHub pauses schedules on idle repositories).
      - name: Save results backup
        run: |
          git config user.name "speed-monitor"
          git config user.email "speed-monitor@users.noreply.github.com"
          git add -f runner/data
          git diff --cached --quiet || git commit -m "Measurements $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet && git push --quiet
